[package]
name = "jarvis-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jarvis-agent"
path = "src/main.rs"

[dependencies]
protocol = { package = "jarvis-agent-protocol", path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = "0.8"
mac_address = "1"
sysinfo = "0.32"
base64 = "0.22"
walkdir = "2"
wait-timeout = "0.2"

# Windows service host lives behind this feature so the Linux/dev build never
# needs it; enable with `--features winservice` when building for Windows.
[features]
winservice = []

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
