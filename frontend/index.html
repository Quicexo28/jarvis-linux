<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover no es decorativo: con targetSdk 35 Android fuerza
         edge-to-edge, y sin esto `env(safe-area-inset-*)` vale 0, así que el
         header quedaba bajo el reloj del sistema y la nav bajo la barra de
         gestos. El resto del layout ya lee esas variables. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jarvis</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#050510" />
    <link rel="apple-touch-icon" href="./icons/jarvis-256.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jarvis" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
