# Jarvis UI window rules for Hyprland (Tauri binary, class: app, title: Jarvis)
# Source this from ~/.config/hypr/hyprland.conf:
#   source = ~/jarvis-linux/scripts/linux/hyprland-jarvis.conf

windowrule {
  name = jarvis
  match:class = ^(app)$
  match:title = ^(Jarvis)$
  fullscreen = 1
  border_size = 0
  workspace = special:jarvis
  # Prevent Jarvis from stealing focus automatically (TTS audio, WebKit activation events).
  suppress_event = activate activatefocus
}

# PTT overlay — ventana Tauri pequeña, visible en todos los workspaces.
windowrule {
  name = jarvis-ptt-overlay
  match:title = ^(JarvisOverlay)$
  float = 1
  pin = 1
  border_size = 0
}

# Sin blur/sombra: Hyprland difumina ventanas transparentes y deja el holo y
# las barras del ecualizador con aspecto desenfocado. Sintaxis de línea nueva
# (campo + valor, matcher con match:).
windowrule = no_blur on, match:title ^(JarvisOverlay)$
windowrule = no_shadow on, match:title ^(JarvisOverlay)$

# Tecla NitroSense (Acer Nitro 5) = push-to-talk.
# Emite evdev code 425 (KEY_PRESENTATION); Hyprland usa keycode xkb = evdev+8 = 433.
# Funciona tanto en modo Tauri como en Chromium app-mode via backend API.
bind  = , code:433, exec, curl -s -X POST http://localhost:8788/api/skills/voice/ptt-start
bindr = , code:433, exec, curl -s -X POST http://localhost:8788/api/skills/voice/ptt-stop
